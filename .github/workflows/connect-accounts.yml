name: Connect accounts

# Connects the live site to its Supabase project: applies the database (supabase/migrations/),
# sets the sign-in settings and email, stores the founder email, points the app at the project
# (data/backend.json) and copies the guide's places into it, then redeploys. Run it by hand once,
# at the end of the setup checklist in docs/accounts-setup.md. After that it runs by itself
# whenever the database, the sign-in settings or the guide's cities change on main. Until the
# secrets are added it does nothing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/templates/**'
      - 'scripts/supabase/**'
      - 'data/cities/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: supabase-live
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
    steps:
      - id: ready
        name: Is the setup checklist done?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Accounts are not set up yet (see docs/accounts-setup.md), so there is nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.ready.outputs.go == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      - name: Apply the database
        if: steps.ready.outputs.go == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --yes
      - name: Sign-in settings, the founder, the app's address and the guide's places
        if: steps.ready.outputs.go == 'true'
        run: node scripts/supabase/connect.mjs
      - id: commit
        if: steps.ready.outputs.go == 'true'
        run: |
          if git diff --quiet -- data/backend.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backend.json
          git commit -m "Point the app at its Supabase project"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: connect
    if: needs.connect.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
