name: Audit city content

# Checks every place's Wikipedia title and lists well-read nearby articles that no place
# points to (candidates for missing sights). Writes seeds/audit/report.json back to the
# branch. See scripts/audit-content.mjs. Mode "suggest" runs scripts/suggest-titles.mjs instead.
on:
  push:
    branches: ['claude/**']
    paths: ['seeds/audit/request.json']
  workflow_dispatch:
    inputs:
      cities:
        description: City ids, comma-separated (empty = request.json, else every city)
        default: ''
      mode:
        description: audit (full report) or suggest (title suggestions for missing titles)
        default: audit

permissions:
  contents: write

concurrency:
  group: audit-${{ github.ref }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: inputs.mode != 'suggest'
        run: node scripts/audit-content.mjs ${{ inputs.cities && format('--city {0}', inputs.cities) || '' }}
      - if: inputs.mode == 'suggest'
        run: node scripts/suggest-titles.mjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seeds/audit/report.json seeds/audit/suggest.json 2>/dev/null || git add seeds/audit/report.json
          git diff --cached --quiet && exit 0
          git commit -m "Content audit report (automated)"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
