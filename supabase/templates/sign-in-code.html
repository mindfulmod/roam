<!doctype html>
<html lang="en">
  <body
    style="margin: 0; padding: 24px; background: #f7f4ee; color: #22201d; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
  >
    <div style="max-width: 440px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 28px">
      <p style="margin: 0 0 8px; font-size: 15px; font-weight: 700; color: #a9431a">Tandem Roads</p>
      <h1 style="margin: 0 0 16px; font-size: 22px; line-height: 1.3">Your sign-in code</h1>
      <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.5">
        Type this code into Tandem Roads to sign in.
      </p>
      <p
        style="margin: 0 0 20px; font-size: 34px; font-weight: 700; letter-spacing: 8px; font-family: ui-monospace, Menlo, Consolas, monospace"
      >
        {{ .Token }}
      </p>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5d5850">
        It works for 15 minutes. If you did not ask for it, you can ignore this email: nobody can
        sign in without the code.
      </p>
    </div>
  </body>
</html>
