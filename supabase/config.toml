# A local Supabase, for the end-to-end account tests (`supabase start`, run by
# .github/workflows/accounts.yml). It is never pushed to the live project: the live project's
# sign-in settings come from scripts/supabase/auth-settings.mjs, applied by
# scripts/supabase/connect.mjs. tests/accounts-config.test.mjs checks that the settings that
# matter (code length and lifetime, the sign-up hook, the email template) agree in both places.
project_id = "tandem-roads"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

# Catches the emails a local run sends, so the tests can read the sign-in codes.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Sign-up stays on: the "before user created" hook below decides who may make an account.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

# Generous limits so a test run can sign several people in quickly.
[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 300
token_verifications = 300

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 900

[auth.email.template.magic_link]
subject = "Your Tandem Roads code: {{ .Token }}"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.confirmation]
subject = "Your Tandem Roads code: {{ .Token }}"
content_path = "./supabase/templates/sign-in-code.html"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/before_user_created"

[analytics]
enabled = false

[edge_runtime]
enabled = false
